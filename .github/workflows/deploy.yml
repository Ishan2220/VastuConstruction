name: Auto Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            # 1. Load user environment safely without crashing on missing files
            if [ -s "$HOME/.nvm/nvm.sh" ]; then
              . "$HOME/.nvm/nvm.sh"
            fi
            if [ -f "$HOME/.profile" ]; then
              . "$HOME/.profile"
            fi
            if [ -f "$HOME/.bashrc" ]; then
              . "$HOME/.bashrc"
            fi
            export PATH="$PATH:/usr/local/bin:/usr/bin:/bin:$HOME/.local/bin:$HOME/bin"

            echo "=== Node & NPM Environment ==="
            which node || true
            which npm || true
            which pm2 || true
            node -v || true
            npm -v || true

            # 2. Locate project root folder
            if [ -d "$HOME/VastuConstruction" ]; then
              cd "$HOME/VastuConstruction"
            elif [ -d "/var/www/VastuConstruction" ]; then
              cd "/var/www/VastuConstruction"
            else
              echo "Error: VastuConstruction folder not found!"
              exit 1
            fi
            PROJECT_DIR=$(pwd)
            echo "Project root directory: $PROJECT_DIR"

            # 3. Pull latest code cleanly
            echo "=== Syncing latest changes from GitHub ==="
            git fetch origin main
            git reset --hard origin/main

            # 4. Server build & database sync
            echo "=== Building Server ==="
            cd "$PROJECT_DIR/server"
            npm install
            npx prisma generate
            npm run build

            # 5. Start or Reload Server with PM2
            echo "=== Starting/Restarting PM2 Server ==="
            cd "$PROJECT_DIR"
            pm2 startOrReload ecosystem.config.js || pm2 restart all || pm2 start npm --name "vastu-server" --cwd ./server -- start
            pm2 save || true

            # 6. Client build
            echo "=== Building Client Frontend ==="
            cd "$PROJECT_DIR/client"
            npm install
            npm run build

            echo "=== Deployment Completed Successfully! ==="
