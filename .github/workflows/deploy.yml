name: Auto Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            # 1. Load user environment safely without crashing on missing files
            if [ -s "$HOME/.nvm/nvm.sh" ]; then
              . "$HOME/.nvm/nvm.sh"
            fi
            if [ -f "$HOME/.profile" ]; then
              . "$HOME/.profile"
            fi
            if [ -f "$HOME/.bashrc" ]; then
              . "$HOME/.bashrc"
            fi
            export PATH="$PATH:/usr/local/bin:/usr/bin:/bin:$HOME/.local/bin:$HOME/bin"

            echo "=== Node & NPM Environment ==="
            which node || true
            which npm || true
            which pm2 || true
            node -v || true
            npm -v || true

            # 2. Locate project root folder
            if [ -d "$HOME/VastuConstruction" ]; then
              cd "$HOME/VastuConstruction"
            elif [ -d "/var/www/VastuConstruction" ]; then
              cd "/var/www/VastuConstruction"
            else
              echo "Error: VastuConstruction folder not found!"
              exit 1
            fi
            PROJECT_DIR=$(pwd)
            echo "Project root directory: $PROJECT_DIR"

            # 3. Pull latest code cleanly
            echo "=== Syncing latest changes from GitHub ==="
            git fetch origin main
            git reset --hard origin/main

            # 4. Server build & database sync
            echo "=== Building Server ==="
            cd "$PROJECT_DIR/server"
            npm install
            npx prisma generate
            npm run build

            # 5. Start or Reload Server with PM2
            echo "=== Starting/Restarting PM2 Server ==="
            cd "$PROJECT_DIR"
            pm2 startOrReload ecosystem.config.js || pm2 restart all || pm2 start npm --name "vastu-server" --cwd ./server -- start
            pm2 save || true

            # 6. Client build
            echo "=== Building Client Frontend ==="
            cd "$PROJECT_DIR/client"
            npm install
            npm run build

            # 7. Sync Frontend to Active Web Server Roots
            echo "=== Locating Web Server Root & Updating Frontend ==="
            cat /etc/caddy/Caddyfile 2>/dev/null || true
            cat /etc/nginx/sites-enabled/* 2>/dev/null || true
            docker ps 2>/dev/null || true

            # Find active web root containing previous frontend files
            TARGET_DIRS=$(find /var/www /usr/share/nginx -name "index-CruaDUUQ.js" 2>/dev/null | xargs -r -n1 dirname | sed 's/\/assets//' | sort -u)
            echo "Found active target web directories: $TARGET_DIRS"

            for dir in $TARGET_DIRS; do
              if [ -d "$dir" ] && [ "$dir" != "$PROJECT_DIR/client/dist" ]; then
                echo "Syncing new dist to: $dir"
                cp -r "$PROJECT_DIR/client/dist/"* "$dir/"
              fi
            done

            if [ -d "/var/www/html" ]; then
              echo "Syncing to /var/www/html"
              cp -r "$PROJECT_DIR/client/dist/"* /var/www/html/ 2>/dev/null || true
            fi

            # Check if Docker container is serving the web client
            if command -v docker >/dev/null 2>&1; then
              CLIENT_CONTAINER=$(docker ps --format '{{.Names}}' | grep -E 'client|frontend|web|nginx' | head -n 1)
              if [ -n "$CLIENT_CONTAINER" ]; then
                echo "Updating client docker container: $CLIENT_CONTAINER"
                docker cp "$PROJECT_DIR/client/dist/." "$CLIENT_CONTAINER:/usr/share/nginx/html/" 2>/dev/null || true
                docker restart "$CLIENT_CONTAINER" 2>/dev/null || true
              fi
            fi

            # Reload webservers
            sudo systemctl reload nginx 2>/dev/null || nginx -s reload 2>/dev/null || true
            sudo systemctl reload caddy 2>/dev/null || caddy reload 2>/dev/null || true

            echo "=== Deployment Completed Successfully! ==="
